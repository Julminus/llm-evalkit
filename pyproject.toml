[project]
name = "llm-evalkit"
version = "0.1.0"
description = "A bilingual (EN/ID) harness for evaluating instruction-following and reasoning quality in LLMs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmad Dzulfikar" }]
requires-python = ">=3.11"
keywords = ["llm", "evaluation", "llm-as-judge", "instruction-following", "bahasa-indonesia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "jinja2>=3.1",
    "jsonschema>=4.23",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.15",
]

[project.scripts]
evalkit = "evalkit.cli:app"

[project.urls]
Repository = "https://github.com/Julminus/llm-evalkit"

[project.optional-dependencies]
anthropic = [
    "anthropic>=2.0",
]

[dependency-groups]
dev = [
    "anthropic>=2.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "PT",      # pytest style
    "C4",      # comprehensions
]
ignore = [
    "RUF001",  # ambiguous unicode chars: bullets (•) and Indonesian text are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "live: needs a running Ollama server with the model pulled (opt-in: EVALKIT_LIVE_OLLAMA=1)",
]

[tool.coverage.run]
source = ["evalkit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
