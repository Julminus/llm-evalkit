name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing
      - name: CLI smoke test
        run: |
          uv run evalkit validate examples/suites/*.yaml
          uv run evalkit check examples/suites/smoke.yaml examples/responses/smoke.jsonl
      - name: Pipeline test (mock provider, no network)
        run: |
          uv run evalkit run examples/suites/smoke.yaml -p mock --mock-responses examples/responses/smoke.jsonl
          # The second run must be served entirely from the response cache.
          uv run evalkit run examples/suites/smoke.yaml -p mock --mock-responses examples/responses/smoke.jsonl | tee second-run.txt
          grep -q "0 generated, 10 from cache" second-run.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build image
        run: docker build -t llm-evalkit:ci .
      - name: run image
        run: |
          docker run --rm llm-evalkit:ci list-checks
          docker run --rm -v "$PWD/examples:/work/examples:ro" llm-evalkit:ci \
            run examples/suites/smoke.yaml -p mock --mock-responses examples/responses/smoke.jsonl \
            --out /tmp/runs --cache-dir /tmp/cache
