name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing
      - name: CLI smoke test
        run: |
          uv run evalkit validate examples/suites/*.yaml
          uv run evalkit check examples/suites/smoke.yaml examples/responses/smoke.jsonl
      - name: Pipeline test (mock provider, no network)
        run: |
          uv run evalkit run examples/suites/smoke.yaml -p mock --mock-responses examples/responses/smoke.jsonl
          # The second run must be served entirely from the response cache.
          uv run evalkit run examples/suites/smoke.yaml -p mock --mock-responses examples/responses/smoke.jsonl | tee second-run.txt
          grep -q "0 generated, 10 from cache" second-run.txt
      - name: Judge test (mock judge, no network)
        run: |
          uv run evalkit judge examples/suites/smoke.yaml examples/responses/smoke.jsonl -j mock --mock-judgments examples/judgments/smoke.jsonl | tee judge-run.txt
          grep -q "judged 10/10 cases: 8 clean, 2 repaired locally" judge-run.txt
          # Re-judging must replay every judgment from the cache.
          uv run evalkit judge examples/suites/smoke.yaml examples/responses/smoke.jsonl -j mock --mock-judgments examples/judgments/smoke.jsonl | tee judge-again.txt
          grep -q "0 requests, 10 cases from cache" judge-again.txt
      - name: Judge reliability test (mock judge, no network)
        run: |
          uv run evalkit judge examples/suites/smoke.yaml examples/responses/smoke.jsonl -j mock --mock-judgments examples/judgments/smoke.jsonl --out ci-runs --run-id judged
          uv run evalkit agree ci-runs/judged/judgments.jsonl examples/labels/smoke.csv | tee agree.txt
          grep -q "10 cases rated by both" agree.txt
          uv run evalkit pairwise examples/suites/smoke.yaml examples/responses/smoke.jsonl examples/responses/smoke-b.jsonl -j mock --mock-judgments examples/judgments/smoke-pairwise.jsonl | tee pairwise.txt
          grep -q "flip rate: 1/10 = 0.100" pairwise.txt
          uv run evalkit consistency examples/suites/smoke.yaml examples/responses/smoke.jsonl -j mock --mock-judgments examples/judgments/smoke.jsonl -n 3 | tee consistency.txt
          grep -q "0 of 10 cases changed a score between samples" consistency.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build image
        run: docker build -t llm-evalkit:ci .
      - name: run image
        run: |
          docker run --rm llm-evalkit:ci list-checks
          docker run --rm -v "$PWD/examples:/work/examples:ro" llm-evalkit:ci \
            run examples/suites/smoke.yaml -p mock --mock-responses examples/responses/smoke.jsonl \
            --out /tmp/runs --cache-dir /tmp/cache
          docker run --rm -v "$PWD/examples:/work/examples:ro" llm-evalkit:ci \
            judge examples/suites/smoke.yaml examples/responses/smoke.jsonl \
            -j mock --mock-judgments examples/judgments/smoke.jsonl --out /tmp/runs --cache-dir /tmp/cache
